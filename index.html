<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Laptops in Pakistan 2026 - Finder & Compare</title>
<meta name="description" content="Find best laptops under your budget in Pakistan. Compare price, RAM, SSD. Student, Gaming, Office laptops.">
<style>
:root{--primary:#6c5ce7;--dark:#2d3436;--light:#f5f6fa;--card:#ffffff}
body{margin:0;font-family:Inter,Segoe UI,sans-serif;background:var(--light);color:var(--dark)}
header{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;padding:40px 20px;text-align:center}
header h1{margin:0;font-size:32px}
header p{opacity:.9}
.container{max-width:1100px;margin:auto;padding:20px}
.tools{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);margin:-30px auto 20px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:15px}
.tools label{font-weight:600;font-size:13px}
.tools input, .tools select{width:100%;padding:10px;border-radius:8px;border:1px solid #ddd;margin-top:5px}
.btn{background:var(--primary);color:#fff;border:none;padding:12px 18px;border-radius:8px;cursor:pointer;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;margin-top:20px}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.06);transition:.2s;border:2px solid transparent}
.card:hover{transform:translateY(-5px);border-color:var(--primary)}
.card img{width:100%;height:150px;object-fit:cover;background:#eee}
.card-body{padding:14px}
.price{color:var(--primary);font-weight:800;font-size:18px}
.badge{display:inline-block;background:#dfe6e9;padding:4px 8px;border-radius:20px;font-size:11px;margin-right:4px}
.compare-box{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--primary);padding:15px;display:none;box-shadow:0 -10px 30px rgba(0,0,0,.1);z-index:99}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
@media(max-width:800px){.tools{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>Laptop Finder Pakistan 2026</h1>
<p>Budget daalo, Laptop pao - Search, Filter & Compare ek jagah</p>
</header>

<div class="container">
<div class="tools">
<div><label>💰 Budget (Max Rs)</label><input type="range" id="budget" min="30000" max="300000" step="10000" value="150000" oninput="budgetVal.innerText=this.value"><div>Upto Rs <span id="budgetVal">150000</span></div></div>
<div><label>🔍 Search</label><input type="text" id="search" placeholder="HP, Dell, i7..." onkeyup="render()"></div>
<div><label>🎯 Use</label><select id="use" onchange="render()"><option value="all">All</option><option value="Student">Student</option><option value="Gaming">Gaming</option><option value="Office">Office</option></select></div>
</div>

<div class="grid" id="grid"></div>
</div>

<div class="compare-box" id="compareBox">
<h3 style="margin:0 0 10px">Compare (<span id="cCount">0</span>/2) <button onclick="clearCompare()" style="float:right">Clear</button></h3>
<table id="compareTable"></table>
</div>

<script>
const laptops=[
{name:"HP Victus 15",price:145000,ram:"16GB",ssd:"512GB",cpu:"i5 12th",use:"Gaming",brand:"HP",img:"https://images.unsplash.com/photo-1588872657576-7efd1f1555ed?w=400"},
{name:"Dell Inspiron 15",price:95000,ram:"8GB",ssd:"256GB",cpu:"i5 11th",use:"Student",brand:"Dell",img:"https://images.unsplash.com/photo-1593642632823-8f785ba67e45?w=400"},
{name:"Lenovo IdeaPad Slim 3",price:85000,ram:"8GB",ssd:"512GB",cpu:"i3 11th",use:"Office",brand:"Lenovo",img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400"},
{name:"Asus ROG Strix",price:245000,ram:"32GB",ssd:"1TB",cpu:"i7 13th",use:"Gaming",brand:"Asus",img:"https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=400"},
{name:"Acer Aspire 7",price:125000,ram:"16GB",ssd:"512GB",cpu:"i5 12th",use:"Student",brand:"Acer",img:"https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?w=400"},
{name:"HP Pavilion 14",price:115000,ram:"8GB",ssd:"512GB",cpu:"i5 12th",use:"Office",brand:"HP",img:"https://images.unsplash.com/photo-1541807084-5c52b6b3adef?w=400"},
];

let compare=[];

function render(){
 let b=parseInt(budget.value), s=search.value.toLowerCase(), u=use.value;
 let filtered=laptops.filter(l=>l.price<=b && (u=="all"||l.use==u) && (l.name.toLowerCase().includes(s)||l.brand.toLowerCase().includes(s)));
 let html="";
 filtered.forEach((l,i)=>{
   html+=`<div class="card">
   <img src="${l.img}" loading="lazy" alt="${l.name}">
   <div class="card-body">
   <span class="badge">${l.brand}</span><span class="badge">${l.use}</span>
   <h3 style="margin:8px 0 4px">${l.name}</h3>
   <div class="price">Rs ${l.price.toLocaleString()}</div>
   <div style="font-size:13px;margin:6px 0">${l.cpu} | ${l.ram} | ${l.ssd}</div>
   <button class="btn" onclick="addCompare(${laptops.indexOf(l)})" style="width:100%;margin-top:8px">+ Compare</button>
   </div></div>`;
 });
 document.getElementById("grid").innerHTML=html||"<p>No laptop found in this budget. Try increasing budget.</p>";
}
function addCompare(idx){
 if(compare.includes(idx)) return;
 if(compare.length>=2){alert("Only 2 laptops can be compared");return;}
 compare.push(idx);
 updateCompare();
}
function updateCompare(){
 document.getElementById("compareBox").style.display=compare.length?"block":"none";
 document.getElementById("cCount").innerText=compare.length;
 if(!compare.length) return;
 let t="<tr><th>Feature</th>"+compare.map(i=>`<th>${laptops[i].name}</th>`).join("")+"</tr>";
 ["price","ram","ssd","cpu","use"].forEach(k=>{
   t+=`<tr><td><b>${k.toUpperCase()}</b></td>`+compare.map(i=>`<td>${laptops[i][k]}</td>`).join("")+"</tr>";
 });
 document.getElementById("compareTable").innerHTML=t;
}
function clearCompare(){compare=[];updateCompare();}
render();
</script>
</body>
</html>
